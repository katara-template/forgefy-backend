version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - path: .env
        required: false
    depends_on:
      redis:
        condition: service_healthy
      # ollama:
      #   condition: service_healthy
    environment:
      APP_ENV: development

      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 5000 --reload

  worker:
    build: .
    env_file:
      - path: .env
        required: false
    depends_on:
      redis:
        condition: service_healthy
      # ollama:
      #   condition: service_healthy
    environment:
      APP_ENV: development

      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2

      # Bot containers join this network so they can reach `api` by name.
      ZOOM_BOT_NETWORK: ${ZOOM_BOT_NETWORK:-forgefy-backend_default}
    volumes:
      - .:/app
      # Required only when ZOOM_BOT_PROVIDER=self_hosted: the worker spawns a
      # bot container per Zoom meeting. NOTE this grants effective root on the
      # host — drop this line to run Zoom through Recall instead.
      - /var/run/docker.sock:/var/run/docker.sock
    # Concurrency comes from CELERY_CONCURRENCY via celery_app.conf, NOT a
    # --concurrency flag here: the flag overrides config, which is how this and
    # Dockerfile.worker would drift apart. Scale out with
    # `docker compose up --scale worker=N` rather than raising it.
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=info
      -Q meeting.audio,meeting.transcribe,meeting.extract,build

  beat:
    build: .
    env_file:
      - path: .env
        required: false
    depends_on:
      redis:
        condition: service_healthy
    environment:
      APP_ENV: development

      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - .:/app
    command: celery -A app.workers.celery_app beat --loglevel=info

  # Self-hosted Zoom bot image. Never started by `docker compose up` — the
  # worker creates one container per meeting from this image. It exists here
  # so `docker compose --profile build-only build zoom-bot` produces it.
  # Requires the Zoom Meeting SDK unpacked into zoom-bot/lib/zoomsdk first;
  # see zoom-bot/README.md.
  zoom-bot:
    build: ./zoom-bot
    image: forgefy-zoom-bot:latest
    profiles: ["build-only"]

