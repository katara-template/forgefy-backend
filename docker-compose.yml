version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - path: .env
        required: false
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      APP_ENV: development

      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 5000 --reload

  worker:
    build: .
    env_file:
      - path: .env
        required: false
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      APP_ENV: development

      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - .:/app
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=info
      -Q meeting.audio,meeting.transcribe,meeting.extract,build

  beat:
    build: .
    env_file:
      - path: .env
        required: false
    depends_on:
      redis:
        condition: service_healthy
    environment:
      APP_ENV: development

      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - .:/app
    command: celery -A app.workers.celery_app beat --loglevel=info

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    entrypoint: ["/bin/sh", "-c"]
    command: [
      "(until ollama list >/dev/null 2>&1; do sleep 2; done && ollama pull qwen3:1.7b) & exec ollama serve"
    ]
    healthcheck:
      test: ["CMD-SHELL", "ollama list 2>/dev/null | grep -q 'qwen3:1.7b' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s

volumes:
  ollama_data:
