version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: voxa
      POSTGRES_PASSWORD: voxa
      POSTGRES_DB: voxa
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxa"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # ollama:
      #   condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://voxa:voxa@postgres:5432/voxa
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - .:/app
    command: >
      sh -c "
        if [ -z \"$(ls -A alembic/versions/ 2>/dev/null)\" ]; then
          echo 'No migrations found — generating initial migration...' &&
          alembic revision --autogenerate -m 'initial';
        fi &&
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 5000 --reload
      "

  worker:
    build: .
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # ollama:
      #   condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://voxa:voxa@postgres:5432/voxa
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - .:/app
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=info
      -Q meeting.audio,meeting.transcribe,meeting.extract

  beat:
    build: .
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://voxa:voxa@postgres:5432/voxa
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - .:/app
    command: celery -A app.workers.celery_app beat --loglevel=info

  # ollama:                          # Uncomment this entire block to enable local Qwen3.
  #   image: ollama/ollama           # Also uncomment the ollama depends_on in api and worker,
  #   ports:                         # and set BP_MODEL=Qwen3 in .env.
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   # Uncomment the deploy block if your server has an NVIDIA GPU.
  #   # Requires nvidia-container-toolkit installed on the host.
  #   # deploy:
  #   #   resources:
