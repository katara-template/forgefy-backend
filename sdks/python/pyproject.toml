[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgefy"
version = "0.1.0"
description = "Official Python SDK for the Forgefy Developer API — transcripts in, structured product requirements out."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["httpx>=0.25"]
keywords = ["forgefy", "requirements", "transcript", "extraction", "meeting"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/forgefy"]
