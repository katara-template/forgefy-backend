[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgefy-backend"
version = "0.1.0"
description = "Forgefy Meeting Mode — AI meeting orchestration backend"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=22.0.0",

    # Firestore / Firebase
    "firebase-admin>=6.5.0",

    # Redis / Celery
    "celery[redis]>=5.4.0",
    "redis[hiredis]>=5.0.0",

    # Auth / Security
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",

    # Config / Validation
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",

    # Rate limiting
    "slowapi>=0.1.9",

    # AI / LLM
    "anthropic>=0.40.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "openai>=1.50.0",

    # Transcription
    "deepgram-sdk>=3.7.0",

    # Browser automation
    "playwright>=1.49.0",

    # Spawning self-hosted Zoom bot containers (ZOOM_BOT_PROVIDER=self_hosted)
    "docker>=7.1.0",

    # HTTP client
    "httpx>=0.27.0",

    # Logging
    "python-json-logger>=3.0.0",

    # Error tracking
    "sentry-sdk[fastapi]>=2.0.0",

    # Media / asset storage
    "cloudinary>=1.40.0",
    "fal-client>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
    "types-python-jose",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# fastapi.File(...) is a dependency-injection marker, not a mutable default —
# same category as Depends/Query, which ruff already exempts by default.
extend-immutable-calls = ["fastapi.File"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# pytest's default norecursedirs includes "build", which silently excluded
# tests/build/ (a real test package, not a build artifact) from every run.
norecursedirs = [".*", "venv", ".venv", "node_modules", "dist"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]
